# 开发期 MinIO + 自动初始化 bucket。
# 启动：docker compose -f docker-compose.attachments.yml up -d
# 控制台：http://localhost:9001  账号 minioadmin / minioadmin
# S3 endpoint：http://localhost:9000
#
# 切换生产环境（OSS / S3）：不动 compose，改 .env 的 S3_ENDPOINT 即可。

services:
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: agent-minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - agent_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  # 一次性 init 容器：等 minio 健康后创建 bucket，然后退出。
  # 重复 docker compose up 不会报错（mb --ignore-existing）。
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: agent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/agent-attachments-dev &&
      mc anonymous set download local/agent-attachments-dev &&
      echo 'bucket agent-attachments-dev ready'
      "

volumes:
  agent_minio_data:
