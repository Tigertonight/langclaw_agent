services:
  postgres:
    image: memory-service-pg:local
    build:
      context: .
      dockerfile: Dockerfile.pg
    container_name: memory-service-pg
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory_service
    ports:
      - "5432:5432"
    volumes:
      - memory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory_service"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  memory-pgdata:
