# 开发环境 override
#
# 用法：docker compose 默认会自动 merge 这个文件。
# 生产环境用 -f docker-compose.yml 单独指定，避免读到这份。
#
# 主要差异：
#   - Postgres / ClickHouse / Redis / MinIO 的内网端口暴露到宿主机 localhost
#     方便本地用 psql / clickhouse-client / redis-cli / mc 直连排查
#   - Worker 跑 NODE_ENV=development，便于看到详细错误堆栈

services:
  postgres:
    ports:
      - "127.0.0.1:5435:5432"

  clickhouse:
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9101:9000"

  redis:
    ports:
      - "127.0.0.1:6380:6379"

  minio:
    ports:
      - "127.0.0.1:9100:9000"

  langfuse-worker:
    environment:
      NODE_ENV: development
